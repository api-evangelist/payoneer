description: 'Payoneer is a global payment platform that enables businesses to pay
  and get paid across borders in multiple currencies. It offers REST APIs for mass
  payouts, marketplace payment distribution, payment requests, and currency conversion.
  The Mass Payout API supports payee registration, account approval, and fund transfers
  at scale, while the Checkout API provides ecommerce platforms with tools to accept
  and manage global payments. Authentication is handled via OAuth2 bearer tokens using
  the client credentials flow, with credentials issued after an integration partnership
  is approved. Payoneer also provides a PSD2-compliant developer portal for European
  banking integrations, and maintains a Postman workspace with published API collections.

  '
